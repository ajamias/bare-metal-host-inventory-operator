                type: string
              poweredOn:
                description: PoweredOn is the current power state.
                type: boolean
              provisioning:
                description: Provisioning holds ID, current image, and state from
                  the backend.
                properties:
                  id:
                    description: ID is the host ID in the Bare Metal Management system.
                    type: string
                  image:
